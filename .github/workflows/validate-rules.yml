name: Validate Semgrep Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned so a new Semgrep release cannot change results between runs.
      # Bump it deliberately and re-run the fixture checks when upgrading.
      - name: Install Semgrep
        run: pip install semgrep==1.184.0

      - name: Scan vulnerable fixtures
        run: semgrep --config rules/ tests/vulnerable/ --metrics=off --json -o vulnerable-results.json

      - name: Scan safe fixtures
        run: semgrep --config rules/ tests/safe/ --metrics=off --json -o safe-results.json

      # Fails if a rule never fires on tests/vulnerable/, or if any rule outside
      # KNOWN_BROAD fires on tests/safe/. An invalid rule file fails the scans above.
      - name: Check results against expectations
        run: python tests/check_fixtures.py vulnerable-results.json safe-results.json
