name: Validate Semgrep Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run rules against vulnerable test cases
        run: |
          echo "=== Scanning vulnerable fixtures ==="
          semgrep --config rules/ tests/vulnerable/ --json > vulnerable-results.json
          count=$(python3 -c "import json; print(len(json.load(open('vulnerable-results.json'))['results']))")
          echo "Findings in vulnerable code: $count"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: Rules produced zero findings on vulnerable test cases"
            exit 1
          fi

      - name: Run rules against safe test cases
        run: |
          echo "=== Scanning safe fixtures ==="
          semgrep --config rules/ tests/safe/ --json > safe-results.json
          count=$(python3 -c "import json; print(len(json.load(open('safe-results.json'))['results']))")
          echo "Findings in safe code: $count"
          if [ "$count" -gt 1 ]; then
            echo "ERROR: Too many findings on safe code (expected 0-1, got $count)"
            echo "Known: path-traversal safe fixture triggers broad-match FP"
            exit 1
          fi

      - name: Validate rule syntax
        run: semgrep --validate --config rules/
